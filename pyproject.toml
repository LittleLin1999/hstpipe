[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "hstpipe"
version = "0.1.0"
description = "Independent STIS spectroscopy and WFC3 UVIS imaging workflows"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "astropy>=5.3", "PyYAML>=6"]
[project.optional-dependencies]
stis = ["crds>=11", "scipy>=1.10", "matplotlib>=3.7", "drizzle>=3", "stistools>=1.4", "stsci.tools>=4"]
uvis = ["crds>=11", "drizzlepac>=3.11", "tweakwcs>=0.9.3", "astroquery>=0.4.7", "pyvo>=1.5", "scipy>=1.10", "photutils>=3.0", "matplotlib>=3.7"]
uvis-image-registration = ["hstpipe[uvis]", "scikit-image>=0.22"]
all = ["hstpipe[stis,uvis]"]
test = ["pytest>=7"]
[project.scripts]
hstpipe = "hstpipe.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.setuptools.data-files]
"share/hstpipe/support" = ["support/bootstrap.sh", "support/check_environment.py", "support/check_stis_products.py", "support/README.md"]
"share/hstpipe/support/hstcal" = ["support/hstcal/build.sh", "support/hstcal/hstcal_coordinate_export.patch", "support/hstcal/LICENSE_hstcal.txt", "support/hstcal/provenance.json"]

"share/hstpipe/support/environments" = ["support/environments/erebus-python311.lock.txt"]
