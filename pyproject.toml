[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "hstpipe"
version = "0.1.0"
description = "Independent STIS spectroscopy and WFC3 UVIS imaging workflows"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "astropy>=5.3", "PyYAML>=6"]
[project.optional-dependencies]
stis = ["scipy>=1.10", "matplotlib>=3.7", "drizzle>=3", "stistools>=1.4"]
uvis = ["drizzlepac>=3.6"]
all = ["hstpipe[stis,uvis]"]
test = ["pytest>=7"]
[project.scripts]
hstpipe = "hstpipe.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
